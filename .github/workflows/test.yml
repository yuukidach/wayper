name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    env:
      # Preference scoring runs on the CPU; skip the multi-hundred-MB GPU provider.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Type check
        run: npm run typecheck

      - name: Test on Node
        run: npm test

      # The app, the ML worker and the packaged CLI run on Electron's Node.
      - name: Test on the Electron runtime
        run: npm run test:electron

      - name: Build
        run: npm run build
