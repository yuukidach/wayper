name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Preference scoring runs on the CPU; skip the multi-hundred-MB GPU provider.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-cache-macos-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-cache-macos-

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm ci --prefer-offline --fetch-timeout=600000 && break
            if [ "$i" -eq 5 ]; then exit 1; fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Build app bundles
        run: npm run build

      - name: Package macOS app
        run: ./node_modules/.bin/electron-builder --mac dmg --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-cache-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-cache-windows-

      - name: Install dependencies
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm ci --prefer-offline --fetch-timeout=600000
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { exit $LASTEXITCODE }
            Write-Host "Attempt $i failed, retrying in 15s..."
            Start-Sleep -Seconds 15
          }

      - name: Build app bundles
        run: npm run build

      - name: Package Windows installer
        run: .\node_modules\.bin\electron-builder.cmd --win nsis --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/macos-dmg/*.dmg
            release-artifacts/windows-installer/*.exe
